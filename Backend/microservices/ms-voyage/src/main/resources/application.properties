spring.application.name=voyage
server.port=8100

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/voyage_db
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Exposer les endpoints health, info et metrics
management.endpoints.web.exposure.include=health,info,metrics
# Afficher les détails du health
management.endpoint.health.show-details=always
# Activer l'affichage des propriétés info.*
management.info.env.enabled=true
# Contenu affiché par /actuator/info
info.app.name=voyage
info.app.version=1.0.0
info.app.description=Microservice de gestion des voyages
logging.file.name=Z:/voyage-loadbalancer.log
# Swagger : URL publique via API Gateway
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.use-root-path=true