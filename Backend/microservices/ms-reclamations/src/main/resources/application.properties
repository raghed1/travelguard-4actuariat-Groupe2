spring.application.name=reclamation
# Port par defaut 8083 ; pour une 2e instance (Load Balancing) : --server.port=8093
server.port=8083

# ==========================================
# EUREKA (nom du service dans Eureka : RECLAMATION)
# ==========================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Id unique par instance (necessaire pour voir 2 instances distinctes dans Eureka)
eureka.instance.instance-id=${spring.application.name}:${server.port}
# Transmettre a Eureka le statut de /actuator/health (DOWN si MongoDB tombe)
eureka.client.healthcheck.enabled=true

# ==========================================
# MONGODB (doit tourner sur le port 27017)
# ==========================================
spring.data.mongodb.uri=mongodb://localhost:27017/reclamation_db
spring.data.mongodb.auto-index-creation=true

# ==========================================
# ACTUATOR / HEALTH
# ==========================================
# Exposer les endpoints health, info et metrics
management.endpoints.web.exposure.include=health,info,metrics
# Afficher les details du health (mongo, diskSpace, ping, discoveryComposite...)
management.endpoint.health.show-details=always
# Activer l'affichage des proprietes info.*
management.info.env.enabled=true
# Contenu affiche par /actuator/info
info.app.name=reclamation
info.app.version=1.0.0
info.app.description=Microservice de gestion des reclamations (claims)

# Afficher le message dans les erreurs JSON (404, 409...)
server.error.include-message=always
