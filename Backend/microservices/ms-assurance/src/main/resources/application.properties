spring.application.name=ms-assurance
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true



# ==========================================
# ACTUATOR - OBSERVABILITE
# ==========================================

# Exposer les endpoints Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers

# Afficher les détails de santé
management.endpoint.health.show-details=always

# Activer la publication des informations info.*
management.info.env.enabled=true

# Informations du microservice
info.app.name=MS Assurance
info.app.version=1.0.0
info.app.description=Microservice de gestion des contrats et garanties
info.app.team=TravelGuard Groupe 2

# ==========================================
# EUREKA - HEALTH CHECK
# ==========================================

# Transmettre l'état de santé à Eureka
eureka.client.healthcheck.enabled=true


# ==========================================
# MYSQL DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/travelguard_assurance?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Swagger : URL publique via API Gateway
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.use-root-path=true
