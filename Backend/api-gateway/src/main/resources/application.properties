
spring.application.name=ApiGateway
server.port=8020

# ==========================================
# EUREKA CLIENT
# ==========================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true

# ==========================================
# DISCOVERY LOCATOR
# ==========================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ==========================================
# ROUTE 0 : MICROservice VOYAGE
# ==========================================
spring.cloud.gateway.server.webmvc.routes[0].id=voyage-dynamic
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://voyage
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/voyage/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=2

# Circuit Breaker Voyage
spring.cloud.gateway.server.webmvc.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[1].args.id=voyageCB
spring.cloud.gateway.server.webmvc.routes[0].filters[1].args.fallbackUri=forward:/fallback/voyage

# ==========================================
# ROUTE 1 : MICROSERVICE ASSURANCE
# ==========================================
spring.cloud.gateway.server.webmvc.routes[1].id=assurance-dynamic
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ms-assurance
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/assurance/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=2

# Circuit Breaker Assurance
spring.cloud.gateway.server.webmvc.routes[1].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[1].args.id=assuranceCB
spring.cloud.gateway.server.webmvc.routes[1].filters[1].args.fallbackUri=forward:/fallback/assurance

# ==========================================
# RESILIENCE4J - VOYAGE
# ==========================================
resilience4j.circuitbreaker.instances.voyageCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.voyageCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.voyageCB.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.voyageCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.voyageCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.voyageCB.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.voyageCB.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.voyageCB.register-health-indicator=true

# ==========================================
# RESILIENCE4J - ASSURANCE
# ==========================================
resilience4j.circuitbreaker.instances.assuranceCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.assuranceCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.assuranceCB.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.assuranceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.assuranceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.assuranceCB.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.assuranceCB.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.assuranceCB.register-health-indicator=true

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always

# ==========================================
# SWAGGER - DOCUMENTATIONS VOYAGE ET ASSURANCE
# ==========================================
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=Voyage
springdoc.swagger-ui.urls[0].url=/api/voyage/v3/api-docs
springdoc.swagger-ui.urls[1].name=Assurance
springdoc.swagger-ui.urls[1].url=/api/assurance/v3/api-docs

# ==========================================
# LOAD BALANCER
# ==========================================
spring.cloud.loadbalancer.cache.ttl=3s

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.cloud.loadbalancer=TRACE
logging.level.org.springframework.cloud.client.loadbalancer=TRACE
logging.level.org.springframework.cloud.loadbalancer.core=TRACE
logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.gateway.server.mvc=TRACE
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG