spring.application.name=api-gateway
server.port=8080

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Route vers Microservice Assurance dynamique
spring.cloud.gateway.server.webmvc.routes[0].id=assurance-dynamic
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ms-assurance
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/assurance/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=2
# ==========================================
# CIRCUIT BREAKER - MS ASSURANCE
# ==========================================

spring.cloud.gateway.server.webmvc.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[1].args.id=assuranceCB
spring.cloud.gateway.server.webmvc.routes[0].filters[1].args.fallbackUri=forward:/fallback/assurance

# ==========================================
# RESILIENCE4J - ASSURANCE
# ==========================================

resilience4j.circuitbreaker.instances.assuranceCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.assuranceCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.assuranceCB.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.assuranceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.assuranceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.assuranceCB.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.assuranceCB.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.assuranceCB.register-health-indicator=true

# ==========================================
# ACTUATOR - OBSERVATION
# ==========================================

management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always

# ==========================================
# LOAD BALANCER DEBUG
# ==========================================

logging.level.org.springframework.cloud.loadbalancer=TRACE
logging.level.org.springframework.cloud.client.loadbalancer=TRACE
logging.level.org.springframework.cloud.loadbalancer.core=TRACE

# Eureka
logging.level.com.netflix.discovery=DEBUG

# Gateway MVC
logging.level.org.springframework.cloud.gateway.server.mvc=TRACE
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# ==========================================
# SWAGGER UI - PORTAIL CENTRALISE
# ==========================================

springdoc.swagger-ui.url=/api/assurance/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true




