spring.application.name=ApiGateway

server.port=8020

# Connexion Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# ==========================================
# ROUTES DYNAMIQUES (avec préfixe /dyn)
# ==========================================
spring.cloud.gateway.server.webmvc.routes[0].id=voyage-dynamic
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://VOYAGE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/dyn/api/destinations/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1